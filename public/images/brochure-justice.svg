<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F3E8FF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#DDD6FE;stop-opacity:0.85" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="800" height="600" fill="url(#grad5)"/>
  
  <!-- Document Sheet -->
  <rect x="80" y="80" width="280" height="440" fill="white" rx="8"/>
  <rect x="100" y="100" width="240" height="110" fill="url(#grad6)" rx="4"/>
  
  <!-- Title in Document -->
  <text x="220" y="130" font-size="24" font-weight="bold" text-anchor="middle" fill="#6D28D9">Pack Justice</text>
  <text x="220" y="160" font-size="14" text-anchor="middle" fill="#7C3AED">Complet & Premium</text>
  
  <!-- Content Lines -->
  <line x1="120" y1="190" x2="300" y2="190" stroke="#ddd" stroke-width="2"/>
  <rect x="110" y="220" width="200" height="8" fill="#8B5CF6" rx="2"/>
  <rect x="110" y="240" width="200" height="6" fill="#7C3AED" rx="2"/>
  <rect x="110" y="260" width="180" height="6" fill="#A78BFA" rx="2"/>
  
  <!-- Text blocks -->
  <text x="120" y="300" font-size="11" fill="#555">✓ Tous les concours justice</text>
  <text x="120" y="325" font-size="11" fill="#555">✓ Support 24/7 illimité</text>
  <text x="120" y="350" font-size="11" fill="#555">✓ Mise à jour régulière</text>
  <text x="120" y="375" font-size="11" fill="#555">✓ Accès vie garantit</text>
  
  <!-- Badge Premium -->
  <circle cx="340" cy="120" r="48" fill="#F3E8FF" opacity="0.95" stroke="#8B5CF6" stroke-width="2"/>
  <text x="340" y="115" font-size="11" font-weight="bold" text-anchor="middle" fill="#6D28D9">PREMIUM</text>
  <text x="340" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#8B5CF6">VIP</text>
  
  <!-- Decorative Elements -->
  <rect x="420" y="100" width="4" height="280" fill="#F3E8FF" opacity="0.4"/>
  <circle cx="450" cy="150" r="20" fill="#DDD6FE" opacity="0.3"/>
  <circle cx="500" cy="300" r="30" fill="#8B5CF6" opacity="0.15"/>
  
  <!-- Footer decoration -->
  <polygon points="100,500 300,500 220,520" fill="#F3E8FF" opacity="0.3"/>
  <text x="220" y="520" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Edition Professionnelle 2026</text>
</svg>