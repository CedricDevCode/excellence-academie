<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e65c00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Main Background -->
  <rect width="800" height="600" fill="url(#grad1)"/>
  
  <!-- Document Sheet -->
  <rect x="80" y="80" width="280" height="440" fill="white" rx="8" shadow="0 10px 30px rgba(0,0,0,0.3)"/>
  <rect x="100" y="100" width="240" height="100" fill="url(#grad2)" rx="4"/>
  
  <!-- Title in Document -->
  <text x="220" y="135" font-size="32" font-weight="bold" text-anchor="middle" fill="#002855">ENA</text>
  <text x="220" y="170" font-size="14" text-anchor="middle" fill="#333">Concours Examen National</text>
  
  <!-- Content Lines -->
  <line x1="120" y1="190" x2="300" y2="190" stroke="#ddd" stroke-width="2"/>
  <rect x="110" y="220" width="200" height="8" fill="#FF6B00" rx="2"/>
  <rect x="110" y="240" width="200" height="6" fill="#FFD700" rx="2"/>
  <rect x="110" y="260" width="180" height="6" fill="#FFA500" rx="2"/>
  
  <!-- Text blocks -->
  <text x="120" y="300" font-size="11" fill="#666">✓ Documents complets</text>
  <text x="120" y="325" font-size="11" fill="#666">✓ Conseils d'experts</text>
  <text x="120" y="350" font-size="11" fill="#666">✓ Exemple d'examen</text>
  <text x="120" y="375" font-size="11" fill="#666">✓ Stratégies éprouvées</text>
  
  <!-- Badge -->
  <circle cx="340" cy="120" r="45" fill="#FFD700" opacity="0.9"/>
  <text x="340" y="125" font-size="24" font-weight="bold" text-anchor="middle" fill="#FF6B00">100%</text>
  <text x="340" y="145" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">Complet</text>
  
  <!-- Decorative Elements -->
  <rect x="420" y="100" width="4" height="280" fill="#FFD700" opacity="0.5"/>
  <circle cx="450" cy="150" r="20" fill="#FFD700" opacity="0.2"/>
  <circle cx="500" cy="300" r="30" fill="#FF6B00" opacity="0.15"/>
</svg>